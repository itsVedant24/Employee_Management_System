<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>EMS Dashboard</title>

    <link rel="stylesheet"
          href="style.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<header>

    <div>

        <h1>EMS Dashboard</h1>

        <p>Employee Management System</p>

    </div>

    <button class="logout-btn"
            onclick="logout()">

        Logout

    </button>

</header>

<nav>

    <button onclick="showSection('dashboard')">
        Dashboard
    </button>

    <button onclick="showSection('employees')">
        Employees
    </button>

    <button onclick="showSection('addEmployee')">
        Add Employee
    </button>

    <button onclick="showSection('salary')">
        Salary
    </button>

    <button onclick="showSection('salarySlips')">
        Salary Slips
    </button>

</nav>

<div class="container">

    <!-- DASHBOARD -->

    <section id="dashboard">

        <h2>Dashboard</h2>

        <div class="dashboard-grid">

            <div class="card">

                <i class="fa-solid fa-users"></i>

                <h3 id="employeeCount">
                    0
                </h3>

                <p>Total Employees</p>

            </div>

            <div class="card">

                <i class="fa-solid fa-money-bill"></i>

                <h3 id="salaryCount">
                    0
                </h3>

                <p>Salary Slips</p>

            </div>

        </div>

    </section>

    <!-- EMPLOYEES -->

    <section id="employees"
             class="hidden">

        <h2>Employee Records</h2>

        <table>

            <thead>

            <tr>

                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>

            </tr>

            </thead>

            <tbody id="employeeTableBody">

            </tbody>

        </table>

    </section>

    <!-- ADD EMPLOYEE -->

    <section id="addEmployee"
             class="hidden">

        <h2>Add Employee</h2>

        <div class="form-grid">

            <div class="input-group">

                <label>Name</label>

                <input type="text"
                       id="name">

            </div>

            <div class="input-group">

                <label>Email</label>

                <input type="email"
                       id="email">

            </div>

            <div class="input-group">

                <label>Department</label>

                <input type="text"
                       id="department">

            </div>

            <div class="input-group">

                <label>Salary</label>

                <input type="number"
                       id="salaryInput">

            </div>

        </div>

        <button class="btn-primary"
                onclick="addEmployee()">

            Add Employee

        </button>

    </section>

    <!-- SALARY -->

    <section id="salary"
             class="hidden">

        <h2>Generate Salary Slip</h2>

        <div class="form-grid">

            <div class="input-group">

                <label>Employee ID</label>

                <input type="number"
                       id="employeeId">

            </div>

            <div class="input-group">

                <label>Basic Salary</label>

                <input type="number"
                       id="basicSalary">

            </div>

            <div class="input-group">

                <label>HRA</label>

                <input type="number"
                       id="hra">

            </div>

            <div class="input-group">

                <label>Bonus</label>

                <input type="number"
                       id="bonus">

            </div>

            <div class="input-group">

                <label>Deductions</label>

                <input type="number"
                       id="deductions">

            </div>

        </div>

        <button class="btn-primary"
                onclick="generateSalarySlip()">

            Generate Salary Slip

        </button>

    </section>

    <!-- SALARY SLIPS -->

    <section id="salarySlips"
             class="hidden">

        <h2>Salary Slips</h2>

        <div id="salarySlipContainer"
             class="salary-container">

        </div>

    </section>

</div>

<script src="script.js"></script>

</body>

</html>
